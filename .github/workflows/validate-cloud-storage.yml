name: Validate Supabase storage branch

on:
  push:
    branches:
      - feature/supabase-cloud-storage
    paths:
      - ".github/workflows/validate-cloud-storage.yml"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "supabase/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-cloud-storage
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate dependency lockfile
        run: bun install --lockfile-only
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: update Bun lockfile for Supabase storage"
            git push
          fi
